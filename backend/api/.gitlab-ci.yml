# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - setup
  - test
  - update
  - build
  - deploy

workflow:
  name: $PIPELINE_NAME
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        PIPELINE_NAME: "Web triggered pipeline"
    - changes: ['**/{*.md,.*ignore,*.yml,.env*}']
      when: never
    - if: $CI_COMMIT_TAG
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH && $CI_MERGE_REQUEST_APPROVED == "true"'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "dev"

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

variables:
  # Define the Node.js version you want to use
  NODE_VERSION: '20'

.job_rules:
  rules:
    manually_triggered_rule:
      - if: '$CI_PIPELINE_SOURCE == "web"'
        when: manual
        allow_failure: true

.dependencies_cache:
  before_script:
    - node --version
  cache:
    - &node_cache
      key:
        files:
          - "$CI_PROJECT_DIR/package-lock.json"
        prefix: $CI_PROJECT_NAME
      paths:
        - "$CI_PROJECT_DIR/node_modules"
      policy: pull

update-cache:
  stage: setup
  extends: .dependencies_cache
  rules:
    - !reference [.job_rules, rules, manually_triggered_rule]
    - changes: [ "package-lock.json" ]
  image: node:$NODE_VERSION
  script:
    - npm ci --prefer-offline --cache .npm_cache
  cache:
    - <<: *node_cache
      policy: pull-push
    - key: ${CI_PROJECT_NAME}-${CI_JOB_NAME}
      paths:
        - .npm_cache/
      when: on_success
      policy: pull-push

unit_test:
  stage: test
  extends: .dependencies_cache
  rules: !reference [.job_rules, rules, manually_triggered_rule]
  image: node:$NODE_VERSION
  script:
    - npm test --ci
  coverage: /All files[^\|]*\|[^\|]*\s+([\d\.]+)/
  artifacts:
    when: always
    paths:
      - test_reports/
    reports:
      junit: test_reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: test_reports/cobertura-coverage.xml

update_packages:
  stage: update
  extends: .dependencies_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        PIPELINE_NAME: "Scheduled pipeline"
    - !reference [.job_rules, rules, manually_triggered_rule]
  image: node:$NODE_VERSION
  before_script:
    - npm install -g pnpm
  script:
    - npm update
    - pnpm install --lockfile-only
    - npm test --ci
    - git checkout $CI_COMMIT_REF_NAME # Ensure we're on the right branch
    - git add package-lock.json pnpm-lock.yaml
    - git -c user.name='Packages Updater' -c user.email='' commit -m "[ci skip] Autoupdate minor packages"
    - git push -o ci.skip https://$CI_COMMITTER_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git $CI_COMMIT_REF_NAME
  cache:
    when: on_success
    policy: pull-push

build:
  stage: build
  extends: .dependencies_cache
  rules: !reference [.job_rules, rules, manually_triggered_rule]
  image: node:$NODE_VERSION
  script:
    - npm run build
    # - npm run start:prod
